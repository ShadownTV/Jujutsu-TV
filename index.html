        .playlist {

        .btn-ep {
            background: #1e1e2f;
            border: 2px solid #2d2d44;
            color: #e2e8f0;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;

        .btn-ep:hover {

            color: #64748b;

// 2. MOTOR DO SITE (Não precisa mexer em nada aqui, ele faz tudo sozinho)
function carregarPlaylist() {
    const containerBotoes = document.querySelector('.playlist') || document.getElementById('botoes-ep');
    if (!containerBotoes) return;
    
    containerBotoes.innerHTML = ''; // Limpa o container

    // Roda um loop na lista e cria um botão roxo para cada episódio automático
    listaEpisodios.forEach((ep, index) => {
        const botao = document.createElement('div');
        botao.className = 'btn-ep'; // Usa a sua classe CSS de estilização
        botao.innerText = ep.nome;
        
        // Quando o usuário clicar, chama a função de dar o play passando o link correto
        botao.onclick = function() {
            mudarVideo(ep.url, ep.nome);
        };

        containerBotoes.appendChild(botao);
    });
}

function mudarVideo(url, nome) {
    const videoElement = document.querySelector('video');
    const sourceElement = videoElement.querySelector('source') || document.getElementById('video-src');

    sourceElement.src = url;
    videoElement.load(); // Força o navegador a carregar o novo vídeo
    videoElement.play(); // Dá o play
    console.log("Tocando agora: " + nome);
}

// Inicializa a grade de botões assim que a página abrir
window.onload = carregarPlaylist;
